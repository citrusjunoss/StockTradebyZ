name: Daily Stock Analysis

on:
  schedule:
    # 每天下午6点 (UTC 10:00, 北京时间18:00)
    # - cron: '0 11 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  stock-analysis:
    runs-on: ubuntu-latest
    env:
      DATASOURCE: ${{ vars.DATASOURCE || 'mootdx' }}  # 从GitHub环境变量获取，默认baostock
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
      deployments: write

    steps:
    - name: Check if weekend
      id: check-weekend
      run: |
        # 获取北京时间的星期几 (0=Sunday, 1=Monday, ..., 6=Saturday)
        WEEKDAY=$(TZ='Asia/Shanghai' date +%w)
        BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')
        echo "当前北京时间: $BEIJING_TIME"
        
        if [[ "$WEEKDAY" == "0" || "$WEEKDAY" == "6" ]]; then
          echo "今天是北京时间周末，跳过股票分析任务"
          echo "is_weekend=true" >> $GITHUB_OUTPUT
        else
          echo "今天是北京时间工作日，继续执行任务"
          echo "is_weekend=false" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      if: steps.check-weekend.outputs.is_weekend == 'false'
      uses: actions/checkout@v4

    - name: Set up Python
      if: steps.check-weekend.outputs.is_weekend == 'false'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      if: steps.check-weekend.outputs.is_weekend == 'false'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Detect best mootdx IP (only for mootdx)
      if: steps.check-weekend.outputs.is_weekend == 'false' && env.DATASOURCE == 'mootdx'
      run: |
        echo "检测mootdx最佳服务器IP..."
        python -m mootdx bestip -vv || echo "mootdx IP检测失败，继续执行"
      continue-on-error: true

    - name: Run fetch_kline
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        echo "开始执行 fetch_kline，使用数据源: ${{ env.DATASOURCE }}"
        python fetch_kline.py --datasource ${{ env.DATASOURCE }} --frequency 4 --exclude-gem false --min-mktcap 5e9 --max-mktcap +inf --start 20200101 --end today --out ./data --workers 10
      continue-on-error: false

    - name: Run select_stock
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        echo "开始执行 select_stock..."
        python select_stock.py --data-dir ./data --config ./configs.json
      continue-on-error: false

    - name: Generate HTML report
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        echo "生成HTML报告..."
        python generate_html.py

    - name: Setup Pages
      if: steps.check-weekend.outputs.is_weekend == 'false'
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: List generated files
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        echo "=== 生成的文件列表 ==="
        echo "根目录HTML文件:"
        ls -la *.html || echo "没有找到HTML文件"
        echo ""
        echo "reports目录HTML文件:"
        ls -la reports/*.html || echo "没有找到reports目录中的HTML文件"
        echo ""
        echo "=== 检查文件内容 ==="
        if [ -f "index.html" ]; then
          echo "index.html exists ($(wc -c < index.html) bytes)"
        fi
        if [ -d "reports" ]; then
          for file in reports/report-*.html; do
            if [ -f "$file" ]; then
              echo "$file exists ($(wc -c < "$file") bytes)"
            fi
          done
        fi

    - name: Upload to GitHub Pages
      if: steps.check-weekend.outputs.is_weekend == 'false'
      uses: actions/upload-pages-artifact@v3
      with:
        path: .

    - name: Deploy to GitHub Pages
      if: steps.check-weekend.outputs.is_weekend == 'false'
      uses: actions/deploy-pages@v4

    - name: Cleanup old files (keep only last 5 days)
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        echo "清理超过5天的缓存和报告文件..."
        
        # 清理 cache 目录中超过5天的文件（跳过 *_latest 文件）
        if [ -d "cache" ]; then
          echo "清理 cache 目录..."
          python cleanup_cache_files.py --path cache --days 5 --extensions .json .csv --skip-token _latest
          echo "cache 目录清理完成"
        else
          echo "未找到 cache 目录，跳过"
        fi
        
        # 清理 reports 目录中超过5天的文件
        if [ -d "reports" ]; then
          echo "清理 reports 目录..."
          python cleanup_cache_files.py --path reports --days 5 --extensions .html .json
          echo "reports 目录清理完成"
        else
          echo "未找到 reports 目录，跳过"
        fi
        
        # 显示清理后的文件列表
        echo "=== 清理后的文件列表 ==="
        if [ -d "cache" ]; then
          echo "cache 目录剩余文件:"
          ls -la cache/ || echo "cache 目录为空"
        fi
        if [ -d "reports" ]; then
          echo "reports 目录剩余文件:"
          ls -la reports/ || echo "reports 目录为空"
        fi

    - name: Commit results (if any changes)
      if: steps.check-weekend.outputs.is_weekend == 'false'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 添加生成的文件和目录
        git add .
        
        # 检查是否有变更
        if git diff --staged --quiet; then
          echo "没有需要提交的变更"
        else
          git commit -m "🤖 Daily stock analysis - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi
